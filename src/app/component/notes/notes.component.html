<div id="container">
    <div id="note-list">
        <div class="heading">
            <h2>Notebook</h2>
            <button (click)="addItem()">New</button>
        </div>

        <input type="text" id="search" name="search" placeholder="🔍 Serach your notes...">

        @for(note of notes(); track note.id){
        <div class="noteContent" [id]="note.id">
            <button class="content" (click)="openContent(note)">
                <h2> {{note.title}} </h2>
                <p> {{note.content}} </p>
            </button>

            <button>
                Delete
            </button>
        </div>
        }

    </div>

    @if (isOpenContent() && selectedNote(); as note) {
    <app-note [id]="note.id" [title]="note.title" [content]="note.content" />
    } @else {
    <div>
        <p>This is contents</p>
        <button (click)="addItem()">New</button>
    </div>
    }

</div>
